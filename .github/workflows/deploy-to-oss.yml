name: Deploy EaseCation Design Docs to Aliyun OSS

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-prod-design-docs
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  CDN_REFRESH_URLS: ${{ vars.CDN_REFRESH_URLS }}
  DEPLOY_DIR: storybook-static
  OSS_PREFIX: storybook/

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    with:
      mode: ${{ vars.WEB_ACTIONS_RUNNER || 'auto' }}
    secrets:
      BBDEV_ROUTER_SSH_KEY: ${{ secrets.BBDEV_ROUTER_SSH_KEY }}

  deploy-gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-slim
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Download deploy metadata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: design-deploy-metadata
          path: tmp/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          should_deploy=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_deploy=true
          elif [ "$CI_CONCLUSION" = "success" ] &&
               node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("tmp/ci/deploy-metadata.json","utf8")); process.exit(v.deploy === true ? 0 : 1)'; then
            should_deploy=true
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "Production deploy required: $should_deploy"

  build-and-deploy:
    needs: [runner-route, deploy-gate]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runs_on) }}
    if: needs.deploy-gate.outputs.should_deploy == 'true'
    steps:
      - name: Validate deployment variables
        shell: bash
        env:
          ROLE_ARN: ${{ vars.ALIYUN_STATIC_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for var in ROLE_ARN OIDC_PROVIDER_ARN OSS_BUCKET; do
            if [ -z "${!var}" ]; then
              echo "::error::${var} is not configured; set the corresponding repository variable."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Run registry check
        if: github.event_name == 'workflow_dispatch'
        run: pnpm registry:check

      - name: Check migration terminology
        if: github.event_name == 'workflow_dispatch'
        run: pnpm visual:migration:check

      - name: Check open-source boundaries
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:open-source

      - name: Run typecheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Run lint
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - name: Run tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test

      - name: Build package
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build

      - name: Build Storybook
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build:storybook

      - name: Check package contents
        if: github.event_name == 'workflow_dispatch'
        run: pnpm pack:check

      - name: Download verified Storybook artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: design-storybook-static
          path: ${{ env.DEPLOY_DIR }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout public deployment contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-source
          persist-credentials: false

      - name: Deploy Storybook through shared contract
        uses: ./.deployment-source/.github/actions/design-storybook
        with:
          role_arn: ${{ vars.ALIYUN_STATIC_DEPLOY_ROLE_ARN }}
          oidc_provider_arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
