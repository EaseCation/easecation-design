name: Deploy EaseCation Design Docs to Aliyun OSS

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-prod-design-docs
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  CDN_REFRESH_URLS: ${{ vars.CDN_REFRESH_URLS }}
  DEPLOY_DIR: storybook-static

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Download deploy metadata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: design-deploy-metadata
          path: tmp/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          should_deploy=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_deploy=true
          elif [ "$CI_CONCLUSION" = "success" ] &&
               node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("tmp/ci/deploy-metadata.json","utf8")); process.exit(v.deploy === true ? 0 : 1)'; then
            should_deploy=true
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "Production deploy required: $should_deploy"

  build-and-deploy:
    needs: deploy-gate
    runs-on: ubuntu-latest
    if: needs.deploy-gate.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Run registry check
        if: github.event_name == 'workflow_dispatch'
        run: pnpm registry:check

      - name: Check migration terminology
        if: github.event_name == 'workflow_dispatch'
        run: pnpm visual:migration:check

      - name: Check open-source boundaries
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:open-source

      - name: Run typecheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Run lint
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - name: Run tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test

      - name: Build package
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build

      - name: Build Storybook
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build:storybook

      - name: Check package contents
        if: github.event_name == 'workflow_dispatch'
        run: pnpm pack:check

      - name: Download verified Storybook artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: design-storybook-static
          path: ${{ env.DEPLOY_DIR }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install Aliyun CLI
        run: |
          curl -fL -o /tmp/aliyun.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

      - name: Configure Aliyun temporary credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_STATIC_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: gh-${{ github.repository_id }}-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Configure Aliyun CLI
        run: |
          set -euo pipefail
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          test -n "$ALIBABA_CLOUD_SECURITY_TOKEN"
          aliyun configure set \
            --mode StsToken \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: Upload Storybook to Aliyun OSS
        run: |
          set -euo pipefail
          test -n "$OSS_BUCKET"
          test -d "$DEPLOY_DIR"
          aliyun ossutil cp -r "./${DEPLOY_DIR}/" "oss://${OSS_BUCKET}/" \
            --region "$ALIYUN_REGION" \
            --force

      - name: Refresh Aliyun CDN cache
        run: |
          set -euo pipefail
          if [ -z "$CDN_REFRESH_URLS" ]; then
            echo "CDN_REFRESH_URLS is not configured, skip CDN refresh"
            exit 0
          fi

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            if ! aliyun cdn RefreshObjectCaches --ObjectPath "$url" --ObjectType "Directory" --Force "true"; then
              echo "CDN directory refresh failed for $url, likely due to quota exhaustion. Upload already completed."
            fi
          done <<< "$CDN_REFRESH_URLS"
