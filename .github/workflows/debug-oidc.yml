name: Debug OIDC Claims
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print claims
        run: |
          set -euo pipefail
          tok="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.aliyuncs.com" | jq -r .value)"
          python3 - "$tok" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))
          PY
