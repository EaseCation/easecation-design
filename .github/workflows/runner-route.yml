name: Select Web Runner

on:
  workflow_call:
    inputs:
      mode:
        description: bbdev (auto is an alias), or explicit github override; never automatic fallback
        type: string
        default: bbdev
    secrets:
      BBDEV_ROUTER_SSH_KEY:
        description: Legacy compatibility input; no SSH router is used
        required: false
    outputs:
      runs_on:
        value: ${{ jobs.route.outputs.runs_on }}
      runner_mode:
        value: ${{ jobs.route.outputs.runner_mode }}

permissions:
  contents: read

jobs:
  route:
    # Never schedule untrusted fork or pull_request_target code on the persistent VM.
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push'))
    runs-on: ${{ fromJSON(inputs.mode == 'github' && '"ubuntu-latest"' || '["self-hosted","linux","x64","ec-web-linux"]') }}
    timeout-minutes: 2
    outputs:
      runs_on: ${{ steps.choose.outputs.runs_on }}
      runner_mode: ${{ steps.choose.outputs.runner_mode }}
    steps:
      - name: Select local execution without paid fallback
        id: choose
        env:
          ROUTER_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$ROUTER_MODE" in
            bbdev|auto)
              echo 'runs_on=["self-hosted","linux","x64","ec-web-linux"]' >> "$GITHUB_OUTPUT"
              echo 'runner_mode=bbdev' >> "$GITHUB_OUTPUT"
              ;;
            github)
              echo 'runs_on="ubuntu-latest"' >> "$GITHUB_OUTPUT"
              echo 'runner_mode=github' >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'Unsupported runner mode' >&2; exit 1 ;;
          esac
