name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runner-route:
    if: >-
      github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'))
    uses: ./.github/workflows/runner-route.yml
    with:
      mode: ${{ vars.WEB_ACTIONS_RUNNER || 'bbdev' }}
    secrets:
      BBDEV_ROUTER_SSH_KEY: ${{ secrets.BBDEV_ROUTER_SSH_KEY }}

  validate:
    if: >-
      github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'))
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - run: pnpm format:check
      - run: pnpm tokens:check
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        if: github.event_name == 'pull_request'
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: pnpm build
      - run: pnpm test:browser
        if: github.event_name == 'pull_request'
      - run: pnpm docs:check
      - run: pnpm build:storybook
      - run: pnpm pack:check
        if: github.event_name == 'pull_request'
      - run: pnpm build:example
        if: github.event_name == 'pull_request'
      - run: pnpm test:interactions
        if: github.event_name == 'pull_request'
      - run: pnpm test:pagination
        if: github.event_name == 'pull_request'
      - run: pnpm test:motion
        if: github.event_name == 'pull_request'
      - run: pnpm test:workflow
        if: github.event_name == 'pull_request'
      - name: Write deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p tmp/ci
          printf '{"deploy":true,"artifact":"design-storybook-static"}\n' > tmp/ci/deploy-metadata.json
      - name: Upload deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: design-deploy-metadata
          path: tmp/ci/deploy-metadata.json
          retention-days: 7
      - name: Upload Storybook static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: design-storybook-static
          path: storybook-static
          retention-days: 7

  notify:
    name: Notify MsgAPI
    needs: validate
    if: >-
      always() && needs.validate.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, ec-web-linux]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout notification snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Send MsgAPI quality-check notification
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          title: EaseDesign - CI 检查
          kind: code
          result: ${{ needs.validate.result }}
          source_sha: ${{ github.sha }}
          environment: MAIN
          target_url: https://design.easecation.net/
          github_token: ${{ github.token }}
          msg_api_key: ${{ secrets.MSG_API_KEY }}
