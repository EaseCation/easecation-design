name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm tokens:check
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:browser
      - run: pnpm docs:check
      - run: pnpm build:storybook
      - run: pnpm pack:check
      - run: pnpm build:example
      - run: pnpm test:interactions
      - run: pnpm test:pagination
      - run: pnpm test:motion
      - name: Write deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p tmp/ci
          printf '{"deploy":true,"artifact":"design-storybook-static"}\n' > tmp/ci/deploy-metadata.json
      - name: Upload deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: design-deploy-metadata
          path: tmp/ci/deploy-metadata.json
          retention-days: 7
      - name: Upload Storybook static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: design-storybook-static
          path: storybook-static
          retention-days: 7

  notify:
    name: Notify MsgAPI
    needs: validate
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send MsgAPI quality-check notification
        continue-on-error: true
        env:
          NOTIFY_GENERATOR: sendGithubActionDeployNotification
          NOTIFY_TITLE: EaseCation Design - Code Push & Quality Check
          NOTIFY_STATUS: ${{ needs.validate.result }}
          NOTIFY_ENVIRONMENT: MAIN
          NOTIFY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NOTIFY_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          NOTIFY_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
          MSG_API_KEY: ${{ secrets.MSG_API_KEY }}
        run: |
          MSG_API_URL='https://msg-api.easecation.net'
          if [ -z "$MSG_API_URL" ] || [ -z "$MSG_API_KEY" ]; then
            echo "MSG_API_URL or MSG_API_KEY is not configured, skip MsgAPI notification"
            exit 0
          fi
          MSG_API_ENDPOINT="${MSG_API_URL%/}"
          case "$MSG_API_ENDPOINT" in
            */sendmsg) ;;
            *) MSG_API_ENDPOINT="${MSG_API_ENDPOINT}/sendmsg" ;;
          esac
          PAYLOAD=$(node <<'NODE'
          const compact = (value) => value === undefined || value === null || value === "" ? undefined : value;
          const options = {
            title: compact(process.env.NOTIFY_TITLE),
            status: compact(process.env.NOTIFY_STATUS) || "info",
            commitMessage: compact(process.env.NOTIFY_COMMIT_MESSAGE),
            commitAuthor: compact(process.env.NOTIFY_COMMIT_AUTHOR),
            commitTime: compact(process.env.NOTIFY_COMMIT_TIME),
            environment: compact(process.env.NOTIFY_ENVIRONMENT),
          };
          process.stdout.write(JSON.stringify({
            project: "webDev",
            generator: process.env.NOTIFY_GENERATOR || "sendGithubActionDeployNotification",
            options: [options],
          }));
          NODE
          )
          curl -fsS -X POST "$MSG_API_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $MSG_API_KEY" \
            -d "$PAYLOAD"
