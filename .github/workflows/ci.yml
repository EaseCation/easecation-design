name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm pack:check
      - run: pnpm build:example
      - name: Write deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p tmp/ci
          printf '{"deploy":true,"artifact":"design-storybook-static"}\n' > tmp/ci/deploy-metadata.json
      - name: Upload deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: design-deploy-metadata
          path: tmp/ci/deploy-metadata.json
          retention-days: 7
      - name: Upload Storybook static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: design-storybook-static
          path: storybook-static
          retention-days: 7

  deploy:
    name: Deploy Storybook to Aliyun OSS
    needs: validate
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-design-docs
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      NODE_VERSION: 22
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      CDN_REFRESH_URLS: ${{ vars.CDN_REFRESH_URLS }}
      DEPLOY_DIR: storybook-static
    steps:
      - name: Download verified Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: design-storybook-static
          path: ${{ env.DEPLOY_DIR }}

      - name: Install Aliyun CLI
        run: |
          curl -fL -o /tmp/aliyun.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

      - name: Configure Aliyun temporary credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_STATIC_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: gh-${{ github.repository_id }}-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Configure Aliyun CLI
        run: |
          set -euo pipefail
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          test -n "$ALIBABA_CLOUD_SECURITY_TOKEN"
          aliyun configure set \
            --mode StsToken \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: Upload Storybook to Aliyun OSS
        run: |
          set -euo pipefail
          test -n "$OSS_BUCKET"
          test -d "$DEPLOY_DIR"
          aliyun ossutil cp -r "./${DEPLOY_DIR}/" "oss://${OSS_BUCKET}/" \
            --region "$ALIYUN_REGION" \
            --force

      - name: Refresh Aliyun CDN cache
        run: |
          set -euo pipefail
          if [ -z "$CDN_REFRESH_URLS" ]; then
            echo "CDN_REFRESH_URLS is not configured, skip CDN refresh"
            exit 0
          fi

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            if ! aliyun cdn RefreshObjectCaches --ObjectPath "$url" --ObjectType "Directory" --Force "true"; then
              echo "CDN directory refresh failed for $url, likely due to quota exhaustion. Upload already completed."
            fi
          done <<< "$CDN_REFRESH_URLS"

  notify:
    name: Notify MsgAPI
    needs: validate
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send MsgAPI quality-check notification
        continue-on-error: true
        env:
          NOTIFY_GENERATOR: sendGithubActionDeployNotification
          NOTIFY_TITLE: EaseCation Design - Code Push & Quality Check
          NOTIFY_STATUS: ${{ needs.validate.result }}
          NOTIFY_ENVIRONMENT: MAIN
          NOTIFY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NOTIFY_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          NOTIFY_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
          MSG_API_KEY: ${{ secrets.MSG_API_KEY }}
        run: |
          MSG_API_URL='https://msg-api.easecation.net'
          if [ -z "$MSG_API_URL" ] || [ -z "$MSG_API_KEY" ]; then
            echo "MSG_API_URL or MSG_API_KEY is not configured, skip MsgAPI notification"
            exit 0
          fi
          MSG_API_ENDPOINT="${MSG_API_URL%/}"
          case "$MSG_API_ENDPOINT" in
            */sendmsg) ;;
            *) MSG_API_ENDPOINT="${MSG_API_ENDPOINT}/sendmsg" ;;
          esac
          PAYLOAD=$(node <<'NODE'
          const compact = (value) => value === undefined || value === null || value === "" ? undefined : value;
          const options = {
            title: compact(process.env.NOTIFY_TITLE),
            status: compact(process.env.NOTIFY_STATUS) || "info",
            commitMessage: compact(process.env.NOTIFY_COMMIT_MESSAGE),
            commitAuthor: compact(process.env.NOTIFY_COMMIT_AUTHOR),
            commitTime: compact(process.env.NOTIFY_COMMIT_TIME),
            environment: compact(process.env.NOTIFY_ENVIRONMENT),
          };
          process.stdout.write(JSON.stringify({
            project: "webDev",
            generator: process.env.NOTIFY_GENERATOR || "sendGithubActionDeployNotification",
            options: [options],
          }));
          NODE
          )
          curl -fsS -X POST "$MSG_API_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $MSG_API_KEY" \
            -d "$PAYLOAD"
