name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  runner-route:
    if: >-
      github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'))
    uses: ./.github/workflows/runner-route.yml
    with:
      mode: ${{ vars.WEB_ACTIONS_RUNNER || 'bbdev' }}
    secrets:
      BBDEV_ROUTER_SSH_KEY: ${{ secrets.BBDEV_ROUTER_SSH_KEY }}

  validate:
    if: >-
      github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'))
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm tokens:check
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:browser
      - run: pnpm docs:check
      - run: pnpm build:storybook
      - run: pnpm pack:check
      - run: pnpm build:example
      - run: pnpm test:interactions
      - run: pnpm test:pagination
      - run: pnpm test:motion
      - run: pnpm test:workflow
      - name: Write deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p tmp/ci
          printf '{"deploy":true,"artifact":"design-storybook-static"}\n' > tmp/ci/deploy-metadata.json
      - name: Upload deploy metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: design-deploy-metadata
          path: tmp/ci/deploy-metadata.json
          retention-days: 7
      - name: Upload Storybook static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: design-storybook-static
          path: storybook-static
          retention-days: 7

  notify:
    name: Notify MsgAPI
    needs: validate
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: EaseCation/deploy-workflows/.github/workflows/code-notify.yml@3da9b40e1ac035bffa7ec168a4d908e5adc12f16
    with:
      title: EaseCation Design - Code Push & Quality Check
      result: ${{ needs.validate.result }}
      source_sha: ${{ github.sha }}
      environment: MAIN
      target_url: https://design.easecation.net/
      category: code
    secrets:
      MSG_API_KEY: ${{ secrets.MSG_API_KEY }}
