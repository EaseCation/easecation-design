name: Internal npm release
on:
  workflow_call:
    inputs:
      release:
        description: SemVer release type
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.repository_owner == 'EaseCation'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm pack:check
      - name: Validate release type
        shell: bash
        run: |
          case "${{ inputs.release }}" in
            patch|minor|major|prerelease) ;;
            *)
              echo "::error::release must be one of: patch, minor, major, prerelease"
              exit 1
              ;;
          esac
      - name: Select version
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = "prerelease" ]; then
            npm version prerelease --preid beta --no-git-tag-version
          else
            npm version "${{ inputs.release }}" --no-git-tag-version
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
