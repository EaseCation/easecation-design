name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to verify and publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Validate release commit input
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git commit SHA."
            exit 1
          fi

      - name: Checkout the requested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify the checked-out commit
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for regression checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete quality gate
        run: pnpm check

      - name: Confirm all changesets were consumed
        shell: bash
        run: |
          set -euo pipefail
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "Pending changesets remain. Run pnpm version-packages and publish the resulting commit."
            exit 1
          fi

      - name: Confirm the package version is unpublished
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published."
            exit 1
          fi

      - name: Publish package
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_args=(--access public)
          if [ "$REPOSITORY_VISIBILITY" = "public" ]; then
            publish_args+=(--provenance)
          else
            echo "Source repository is ${REPOSITORY_VISIBILITY}; npm provenance is available only for public repositories."
          fi
          npm publish "${publish_args[@]}"
