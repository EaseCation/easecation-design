name: Manual npm release
on:
  workflow_dispatch:
    inputs:
      release:
        description: SemVer release type
        required: true
        type: choice
        options: [patch, minor, major, prerelease]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm visual:migration:check
      - run: pnpm check:open-source
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm pack:check
      - name: Select version
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = "prerelease" ]; then
            npm version prerelease --preid beta --no-git-tag-version
          else
            npm version "${{ inputs.release }}" --no-git-tag-version
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# Compatibility workflow created because no user-supplied publishing script was provided.
