packages:
  - .
  - examples/*
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# 安全修复：将受影响的传递依赖限定在已修补版本。
overrides:
  fast-uri: 3.1.9
  brace-expansion: 5.0.12
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'launch-editor@<2.14.2': 2.14.2
